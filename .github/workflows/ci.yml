name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19.10.2026; Playwright 1.63's dependency installer predates it.
    # Move together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Self-hosted dish photos (scripts/photos/materialize.mjs, ADR 0011): downloaded and encoded once per manifest and
      # pipeline version; without the cache a clean run takes ≈ 4–6 min.
      - uses: actions/cache@v4
        with:
          path: .cache/dish-photos
          key: dish-photos-${{ hashFiles('packages/taste-core/data/photo-manifest.json', 'scripts/photos/files.mjs') }}
          restore-keys: dish-photos-
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # Playwright's own Chromium; when its download service fails (11.11.2026: HTTP 400 for every Chromium build), the
      # e2e smoke runs in the Google Chrome the runner image ships — a failed download must not hide a green suite.
      - name: Browser for the e2e smoke
        run: |
          # A stuck download counts as a failed one (the job's 30 min would otherwise run out here).
          if ! timeout 420 npx playwright install --with-deps chromium; then
            echo "::warning::Playwright's Chromium could not be downloaded; the e2e smoke uses the runner's Chrome"
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
            timeout 300 npx playwright install-deps chromium || true
          fi
      - name: E2E smoke (Chromium)
        run: npm run test:e2e -- --project=chromium
      - name: Lighthouse (desktop budgets)
        run: npm run lhci
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            apps/web/playwright-report/
            .lighthouseci/
          retention-days: 7
