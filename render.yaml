# Render Blueprint — https://render.com/docs/blueprint-spec
# Static site: free, served from Render's CDN, never sleeps. Kiki's server is the Web Service `refectorio-api`
# (Frankfurt, free: sleeps after 15 min idle, wakes in ≈ 30–60 s — the site pings /health ahead; ADR 0013).
services:
  - type: web
    runtime: static
    name: refectorio
    buildCommand: npm ci --include=dev && npm run build -w @refectorio/web
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_BASE
        value: /
      # Dish photos from our own origin (ADR 0011). With `unsplash`, add https://images.unsplash.com to img-src below.
      - key: PHOTO_HOSTING
        value: self
      - key: HUSKY
        value: '0'
      # Kiki's server origin (CSP connect-src below and the build's <meta> CSP must name the same origin).
      - key: VITE_API_ORIGIN
        value: https://refectorio-api.onrender.com
    headers:
      # Hashed build output never changes — cache for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Dish photo names carry the photo, its crop and the pipeline version (scripts/photos/files.mjs): never change.
      - path: /dish-photos/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://refectorio-api.onrender.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

  - type: web
    runtime: node
    name: refectorio-api
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @refectorio/api
    startCommand: node apps/api/dist/server.mjs
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: HUSKY
        value: '0'
      # Secrets and settings the team pastes in the Render dashboard (never in git): the NVIDIA key, the model chain
      # (`nvidia:<model>[?reasoning_effort=low]`, comma-separated, primary first) and the allowed site origins.
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: AI_PROVIDERS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Per-address limits × N (a whole class on one school address on demo day); the server-wide cap stays.
      - key: KIKI_LIMIT_SCALE
        value: '1'
      # Demo passes (D-128): the secret behind `#kiki-pass=…` links (≥ 32 characters; a new one revokes every pass).
      - key: KIKI_DEMO_SECRET
        sync: false
      # Model calls per minute for everyone / only for demo passes (sum below the provider's 15 / min); `KIKI_PUBLIC=0`
      # leaves Kiki to demo passes only (the final's hour).
      - key: KIKI_PUBLIC_PER_MIN
        value: '8'
      - key: KIKI_RESERVE_PER_MIN
        value: '4'
      - key: KIKI_PUBLIC
        value: '1'
      # Demo-pass names to turn off one by one (comma-separated), without a new secret for everyone (D-130).
      - key: KIKI_REVOKED_PASSES
        sync: false
