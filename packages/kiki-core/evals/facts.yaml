# Menu facts: answerable only with read tools; numbers and names from the fixture week.
- id: facts-today-dinner
  tags: [facts]
  turns:
    - user: что у меня сегодня на ужин?
      expect:
        mustInclude: [Гречка с грибами]
        toolsNone: [propose_menu_change]

- id: facts-wed-dinner-salmon
  tags: [facts, bakeoff]
  turns:
    - user: чё в среду вечером есть буду
      expect:
        toolsNone: [propose_menu_change]
        mustInclude: [лосось]

- id: facts-carbonara-kcal
  tags: [facts]
  turns:
    - user: сколько ккал в карбонаре?
      expect:
        toolsAny: [find_in_menu, get_menu, get_item_details]
        mustInclude: ['634']

