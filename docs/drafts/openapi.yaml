# Черновик контракта API Refectorio (этапы 2–3). Не реализован.
openapi: 3.1.0
info:
  title: Refectorio API
  version: 0.1.0-draft
  description: >
    Сервер считает нормы детерминированно (packages/nutrition-core), фильтрует базу блюд, вызывает ИИ только для выбора
    блюд по ID и текстов, проверяет ответ валидатором и при сбое строит меню алгоритмом без ИИ.
servers:
  - url: https://refectorio-api.onrender.com
    description: Render Web Service (Frankfurt) — адрес появится на этапе 2
paths:
  /health:
    get:
      summary: Проверка живости (будильник и прогрев)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
  /v1/norms:
    post:
      summary: Расчёт норм и решение guardrails по обезличенной анкете
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Questionnaire' }
      responses:
        '200':
          description: Нормы и решение guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NormsResult' }
        '422': { description: Ошибка ввода (диапазоны, единицы) }
  /v1/menu:
    post:
      summary: Генерация меню
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionnaire, days]
              properties:
                questionnaire: { $ref: '#/components/schemas/Questionnaire' }
                days: { type: integer, minimum: 1, maximum: 7 }
                altcha: { type: string, description: Решение самохостинговой капчи ALTCHA }
      responses:
        '200':
          description: Меню (числа — из кода, тексты — от ИИ или шаблонов)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '403': { description: Guardrails — BLOCK (персональное меню недоступно) }
        '429': { description: Превышен лимит запросов }
components:
  schemas:
    Questionnaire:
      type: object
      required: [ageYears, sex, heightCm, weightKg, activity, goal]
      properties:
        ageYears: { type: number, minimum: 1, maximum: 110 }
        sex: { type: string, enum: [male, female, unspecified] }
        heightCm: { type: number, minimum: 50, maximum: 250 }
        weightKg: { type: number, minimum: 5, maximum: 350 }
        bodyFatPct: { type: number, minimum: 3, maximum: 70 }
        activity: { type: string, enum: [kfa1, kfa2, kfa3, kfa4] }
        goal: { type: string, enum: [maintain, lose, gain, habits] }
        ratePctWeek: { type: number, minimum: 0, maximum: 1 }
        pregnancy: { type: string, enum: [none, trimester1, trimester2, trimester3] }
        lactation: { type: string, enum: [none, months0to6, months7to12] }
        familyMode: { type: boolean }
        healthFlags:
          type: array
          items:
            {
              type: string,
              enum:
                [
                  diabetes_insulin,
                  diabetes_other,
                  kidney_disease,
                  pku,
                  eating_disorder_risk,
                  warfarin,
                  maoi,
                ],
            }
        allergens:
          type: array
          items:
            type: object
            properties:
              code:
                {
                  type: string,
                  enum:
                    [
                      GLUTEN,
                      CRUSTACEAN,
                      MOLLUSC,
                      FISH,
                      EGG,
                      MILK,
                      TREE_NUT,
                      PEANUT,
                      SOY,
                      CELERY,
                      MUSTARD,
                      SESAME,
                      SULPHITES,
                      LUPIN,
                      ASPARTAME,
                    ],
                }
              level: { type: string, enum: [intolerance, allergy, severe_allergy] }
        diet:
          {
            type: string,
            enum:
              [
                omnivore,
                vegetarian_lacto_ovo,
                vegetarian_lacto,
                vegetarian_ovo,
                vegan,
                lent_lay,
                halal,
                kosher,
              ],
          }
        mealsPerDay: { type: integer, minimum: 2, maximum: 6 }
        cookTimeMaxMin: { type: integer, minimum: 5, maximum: 180 }
        budget: { type: string, enum: [economy, medium, unlimited] }
        dislikes: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        dislikesOther: { type: string, maxLength: 150 }
    Guardrail:
      type: object
      properties:
        action: { type: string, enum: [allowed, limited, refer, adult_only, blocked] }
        reasons: { type: array, items: { type: string } }
    NormsResult:
      type: object
      properties:
        guardrail: { $ref: '#/components/schemas/Guardrail' }
        bmrKcal: { type: number }
        tdeeKcal: { type: number }
        targetKcal: { type: number }
        proteinG: { type: number }
        fatG: { type: number }
        carbG: { type: number }
        fiberG: { type: number }
        waterMl: { type: number }
        method:
          { type: string, description: 'Например: mifflin_st_jeor × КФА II (МР 2.3.1.0253-21)' }
        sources: { type: array, items: { type: string } }
    Menu:
      type: object
      properties:
        source: { type: string, enum: [ai, algorithm] }
        model: { type: string }
        days:
          type: array
          items:
            type: object
            properties:
              meals:
                type: array
                items:
                  type: object
                  properties:
                    mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
                    dishId: { type: string }
                    portion: { type: number, minimum: 0.5, maximum: 1.5 }
                    energyKcal: { type: number }
                    proteinG: { type: number }
                    why: { type: string, description: Текст ИИ или шаблона, без чисел }
        validator:
          type: object
          properties:
            ok: { type: boolean }
            issues: { type: array, items: { type: string } }
